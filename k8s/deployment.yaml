apiVersion: apps/v1
kind: Deployment
metadata:
  name: apex-council
  namespace: ai-platform
  labels:
    app.kubernetes.io/name: apex-council
    app.kubernetes.io/part-of: ai-infrastructure
    app.kubernetes.io/component: code-engine
spec:
  replicas: 3
  selector:
    matchLabels:
      app: apex-council
  template:
    metadata:
      labels:
        app: apex-council
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
      containers:
        - name: apex-council
          image: ghcr.io/your-org/apex-council:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          envFrom:
            - configMapRef:
                name: apex-council-config
            - secretRef:
                name: apex-council-secrets
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              cpu: 2000m
              memory: 2Gi
          livenessProbe:
            httpGet:
              path: /api/health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /api/health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
