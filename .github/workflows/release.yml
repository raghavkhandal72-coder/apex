name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Publish Release Binary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verify Standard Library Purity (pip = 0)
        run: python tools/check_stdlib_only.py apex_council tools

      - name: Run Test Suite
        run: python -m unittest discover -s tests

      - name: Compile Standalone Executable (.pyz zipapp)
        run: python scripts/build_pyz.py

      - name: Generate Checksums
        run: |
          cd dist
          sha256sum apex.pyz > apex.pyz.sha256
          cat apex.pyz.sha256

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Apex ${{ github.ref_name }}
          files: |
            dist/apex.pyz
            dist/apex.pyz.sha256
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
