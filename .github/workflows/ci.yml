name: Apex CI Matrix

on:
  push:
    branches: [ master, main, dev ]
  pull_request:
    branches: [ master, main ]

jobs:
  test:
    name: Test (OS ${{ matrix.os }} - Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ['3.10', '3.11', '3.12']

    steps:
    - name: Check out repository
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Run Complete Test Suite (241 Tests)
      run: |
        python -m unittest discover -s tests -v

    - name: Build Standalone Executable Archive
      run: |
        python scripts/build_pyz.py

    - name: Smoke Test Standalone Binary
      run: |
        python dist/apex.pyz --help
        python dist/apex.pyz rea --help
        python dist/apex.pyz reviewdog --help
        python dist/apex.pyz netdata --help
