# Copy to .github/workflows/pr-review.yml in the repo you want reviewed.
name: Apex PR Review
on: pull_request

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: ./
        with:
          command: python main.py lint apex_council --format rdjson
          max-comments: "20"
