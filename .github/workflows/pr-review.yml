# Copy to .github/workflows/pr-review.yml in the repo you want reviewed.
name: Apex PR Review
on: pull_request

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: raghavkhandal72-coder/apex@v0.1.0      # pin a released tag, never a moving branch
        with:
          # Any tool that prints rdjson works, e.g. your own linter wrapper:
          command: python apex.pyz reviewdog lint.log --format rdjson
          max-comments: "20"
