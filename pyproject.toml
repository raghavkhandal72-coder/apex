[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "apex-sovereign"
version = "0.9.0"
description = "Autonomous self-healing code engine: CEGIS 1-token synthesis, Mark Weiser AST program slicing, multi-LLM consensus court, REA reverse engineering (pip = 0)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = []          # keep empty: the zero-dependency promise is enforced in CI
keywords = [
    "program-repair",
    "fault-localization",
    "code-review",
    "zero-dependencies",
    "mutation-testing",
    "language-server",
    "flamegraph",
    "slicing",
    "null-safety",
]

[project.urls]
Homepage = "https://github.com/raghavkhandal72-coder/apex"

[project.scripts]
# Point this at your real CLI entry point.
apex = "apex_council.cli:main"
apex-council = "apex_council.cli:main"
apex-lint = "apex_council.lint.rules:main"

[tool.setuptools.packages.find]
include = ["apex_council*"]

[tool.ruff]
line-length = 110
