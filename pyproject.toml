[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "apex-repair"
version = "0.1.0"
description = "Zero-dependency Python program repair: localize, search, verify."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = []          # keep empty: the zero-dependency promise is enforced in CI
keywords = [
    "program-repair",
    "fault-localization",
    "code-review",
    "zero-dependencies",
    "mutation-testing",
    "language-server",
    "flamegraph",
    "slicing",
    "null-safety",
]

[project.urls]
Homepage = "https://github.com/raghavkhandal72-coder/apex"

[project.scripts]
# Point this at your real CLI entry point.
apex = "apex_council.cli:main"
apex-lint = "apex_council.lint.rules:main"

[tool.setuptools.packages.find]
include = ["apex_council*"]

[tool.ruff]
line-length = 110
